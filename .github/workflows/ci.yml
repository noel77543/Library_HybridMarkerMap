name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # 實機 UI 測試 (connectedAndroidTest) 需要裝置與 Maps API key，不在 CI 執行
      - name: Unit tests, lint and build
        run: >
          ./gradlew
          :hybridmarkermap:testDebugUnitTest
          :hybridmarkermap:lintRelease
          :hybridmarkermap:publishToMavenLocal
          :app:assembleDebug
          :app:lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            hybridmarkermap/build/reports/
            app/build/reports/
